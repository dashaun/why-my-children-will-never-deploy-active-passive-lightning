version: '3.8'

networks:
  gemfire-cache:
    external: true

services:
  # ============================================
  # Cluster 3 - Locator
  # ============================================
  gf3-locator:
    image: gemfire/gemfire:10.1-jdk21
    container_name: gf3-locator
    networks:
      - gemfire-cache
    environment:
      - ACCEPT_TERMS=y
    command: >
      gfsh start locator
      --name=gf3-locator
      --enable-cluster-configuration=true
      --connect=false
      --port=10003
      --http-service-port=7073
      --J=-Dgemfire.tcp-port=11112
      --J=-Dgemfire.jmx-manager-port=1097
      --max-heap=250m
      --initial-heap=250m
      --J=-Dgemfire.distributed-system-id=3
      --J=-Dgemfire.remote-locators=gf1-locator[10001],gf2-locator[10002]
      --J=-Dgemfire.prometheus.metrics.emission=Default
      --J=-Dgemfire.prometheus.metrics.port=7777
      --J=-Duser.timezone=Asia/Kolkata
      --J=-Dgemfire.prometheus.metrics.interval=15s
    healthcheck:
      test: ["CMD", "gfsh", "-e", "connect --locator=gf3-locator[10003]"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ============================================
  # Cluster 3 - Server
  # ============================================
  gf3-server:
    image: gemfire/gemfire:10.1-jdk21
    container_name: gf3-server
    networks:
      - gemfire-cache
    environment:
      - ACCEPT_TERMS=y
    command: >
      gfsh start server
      --name=gf3-server
      --use-cluster-configuration=true
      --server-port=10103
      --locators=gf3-locator[10003]
      --max-heap=1g
      --initial-heap=1g
      --J=-Dgemfire.distributed-system-id=3
      --J=-Dgemfire.prometheus.metrics.emission=Default
      --J=-Dgemfire.prometheus.metrics.port=7777
      --J=-Duser.timezone=America/New_York
      --J=-Dgemfire.prometheus.metrics.interval=15s
    depends_on:
      gf3-locator:
        condition: service_healthy

  # ============================================
  # Cluster 3 - Configuration
  # ============================================
  gf3-config:
    image: gemfire/gemfire:10.1-jdk21
    container_name: gf3-config
    networks:
      - gemfire-cache
    depends_on:
      gf3-server:
        condition: service_started
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Waiting for Cluster 3 to be ready..."
        sleep 10
        
        echo "Configuring PDX on Cluster 3..."
        gfsh -e "connect --locator=gf3-locator[10003]" \
             -e "configure pdx --read-serialized=true --disk-store"
        
        echo "Setting up WAN gateway receiver on Cluster 3..."
        gfsh -e "connect --locator=gf3-locator[10003]" \
             -e "create gateway-receiver"
        
        echo "Setting up WAN gateway senders on Cluster 3..."
        gfsh -e "connect --locator=gf3-locator[10003]" \
             -e "create gateway-sender --id=Account_Sender_to_1 --parallel=true --remote-distributed-system-id=1 --enable-persistence=true --enable-batch-conflation=true" \
             -e "create gateway-sender --id=Account_Sender_to_2 --parallel=true --remote-distributed-system-id=2 --enable-persistence=true --enable-batch-conflation=true" \
             -e "create gateway-sender --id=Account_Sender_to_4 --parallel=true --remote-distributed-system-id=4 --enable-persistence=true --enable-batch-conflation=true" \
             -e "create gateway-sender --id=Account_Sender_to_5 --parallel=true --remote-distributed-system-id=5 --enable-persistence=true --enable-batch-conflation=true"
        
        echo "Creating regions on Cluster 3..."
        gfsh -e "connect --locator=gf3-locator[10003]" \
             -e "create region --name=Account --type=PARTITION --gateway-sender-id=Account_Sender_to_1,Account_Sender_to_2,Account_Sender_to_4,Account_Sender_to_5" \
             -e "create region --name=health3 --type=PARTITION"
        
        echo "Cluster 3 configuration complete!"

  # ============================================
  # Cluster 3 - Publish app (one per region)
  # ============================================
  publish3:
    image: publish:0
    container_name: publish3
    networks:
      - gemfire-cache
    environment:
      GEMFIRE_LOCATOR_HOST: gf3-locator
      GEMFIRE_LOCATOR_PORT: 10003
      REGION_NAME: region3
      REGION_TIMEZONE: Asia/Kolkata
    depends_on:
      gf3-config:
        condition: service_completed_successfully
    restart: unless-stopped