version: '3.8'

networks:
  gemfire-cache:
    external: true

services:
  # ============================================
  # Cluster 2 - Locator
  # ============================================
  gf2-locator:
    image: gemfire/gemfire:10.1-jdk21
    container_name: gf2-locator
    networks:
      - gemfire-cache
    environment:
      - ACCEPT_TERMS=y
    command: >
      gfsh start locator
      --name=gf2-locator
      --enable-cluster-configuration=true
      --connect=false
      --port=10002
      --http-service-port=7072
      --J=-Dgemfire.tcp-port=11111
      --J=-Dgemfire.jmx-manager-port=1098
      --max-heap=250m
      --initial-heap=250m
      --J=-Dgemfire.distributed-system-id=2
      --J=-Dgemfire.remote-locators=gf1-locator[10001],gf3-locator[10003]
      --J=-Dgemfire.prometheus.metrics.emission=Default
      --J=-Dgemfire.prometheus.metrics.port=7777
      --J=-Duser.timezone=Europe/Amsterdam
      --J=-Dgemfire.prometheus.metrics.interval=15s
    healthcheck:
      test: ["CMD", "gfsh", "-e", "connect --locator=gf2-locator[10002]"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ============================================
  # Cluster 2 - Server
  # ============================================
  gf2-server:
    image: gemfire/gemfire:10.1-jdk21
    container_name: gf2-server
    networks:
      - gemfire-cache
    environment:
      - ACCEPT_TERMS=y
    command: >
      gfsh start server
      --name=gf2-server
      --use-cluster-configuration=true
      --server-port=10102
      --locators=gf2-locator[10002]
      --max-heap=1g
      --initial-heap=1g
      --J=-Dgemfire.distributed-system-id=2
      --J=-Dgemfire.prometheus.metrics.emission=Default
      --J=-Dgemfire.prometheus.metrics.port=7777
      --J=-Duser.timezone=America/New_York
      --J=-Dgemfire.prometheus.metrics.interval=15s
    depends_on:
      gf2-locator:
        condition: service_healthy

  # ============================================
  # Cluster 2 - Configuration
  # ============================================
  gf2-config:
    image: gemfire/gemfire:10.1-jdk21
    container_name: gf2-config
    networks:
      - gemfire-cache
    depends_on:
      gf2-server:
        condition: service_started
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Waiting for Cluster 2 to be ready..."
        sleep 10
        
        echo "Configuring PDX on Cluster 2..."
        gfsh -e "connect --locator=gf2-locator[10002]" \
             -e "configure pdx --read-serialized=true --disk-store"
        
        echo "Setting up WAN gateway receiver on Cluster 2..."
        gfsh -e "connect --locator=gf2-locator[10002]" \
             -e "create gateway-receiver"
        
        echo "Setting up WAN gateway senders on Cluster 2..."
        gfsh -e "connect --locator=gf2-locator[10002]" \
             -e "create gateway-sender --id=Account_Sender_to_1 --parallel=true --remote-distributed-system-id=1 --enable-persistence=true --enable-batch-conflation=true" \
             -e "create gateway-sender --id=Account_Sender_to_3 --parallel=true --remote-distributed-system-id=3 --enable-persistence=true --enable-batch-conflation=true" \
             -e "create gateway-sender --id=Account_Sender_to_4 --parallel=true --remote-distributed-system-id=4 --enable-persistence=true --enable-batch-conflation=true" \
             -e "create gateway-sender --id=Account_Sender_to_5 --parallel=true --remote-distributed-system-id=5 --enable-persistence=true --enable-batch-conflation=true"
        
        echo "Creating regions on Cluster 2..."
        gfsh -e "connect --locator=gf2-locator[10002]" \
             -e "create region --name=Account --type=PARTITION --gateway-sender-id=Account_Sender_to_1,Account_Sender_to_3,Account_Sender_to_4,Account_Sender_to_5" \
             -e "create region --name=health2 --type=PARTITION"
        
        echo "Cluster 2 configuration complete!"

  # ============================================
  # Cluster 2 - Publish app (one per region)
  # ============================================
  publish2:
    image: publish:0
    container_name: publish2
    networks:
      - gemfire-cache
    environment:
      GEMFIRE_LOCATOR_HOST: gf2-locator
      GEMFIRE_LOCATOR_PORT: 10002
      REGION_NAME: region2
      REGION_TIMEZONE: Europe/Amsterdam
    depends_on:
      gf2-config:
        condition: service_completed_successfully
    restart: unless-stopped